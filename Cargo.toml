[package]
name = "kalam"
version = "1.0.0"
edition = "2021"
description = "Kalam (کَلَم) - Dynamic keyboard layout text converter"
default-run = "kalam"

[dependencies]
arboard = "3.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "implement",
] }

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "kalam"
path = "src/main.rs"

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]